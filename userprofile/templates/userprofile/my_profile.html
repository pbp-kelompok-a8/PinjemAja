{% extends 'userprofile/profile_base.html' %}
{% block sidebar_content %}
<div class="text-center">
    <div class="profile-avatar mx-auto mb-3">
        {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" style="width:100%;height:100%;object-fit:cover;" alt="Foto profil">
        {% else %}
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        {% endif %}
    </div>
    <h5>@{{ request.user.username }}</h5>
    <p class="profile-joined">Bergabung {{ request.user.date_joined|date:"M Y" }}</p>
    <a href="{% url 'userprofile:edit_profile' %}" class="btn btn-outline-warning mb-4">Edit Profile</a>
</div>
<div class="text-start">
    <label class="form-label">Nama</label>
    <input class="form-control mb-3" value="{{ request.user.first_name|default:request.user.username }}" disabled>
    <label class="form-label">Email</label>
    <input class="form-control mb-3"
           value="{{ request.user.email|default:'-' }}"
           disabled>

    <label class="form-label">Nomor Telepon</label>
    <input class="form-control mb-3"
           value="{{ profile.phone_number|default:'-' }}"
           disabled>

       
       <h6 class="mt-4 mb-3">Informasi Pembayaran</h6>

       <label class="form-label">Metode Pencairan</label>
    <input class="form-control mb-3"
           value="{{ profile.payment_provider|default:'-' }}"
           disabled>

    <label class="form-label">
        {% if profile.is_ewallet %}
            Nomor HP E-Wallet
        {% else %}
            Nomor Rekening
        {% endif %}
    </label>
    <input class="form-control mb-3"
           value="{{ profile.payment_number|default:'-' }}"
           disabled>

    <label class="form-label">Nama Pemilik Rekening/Akun</label>
    <input class="form-control mb-3"
           value="{{ profile.payment_holder|default:'-' }}"
           disabled>
    <h6 class="mt-3 mb-3">Alamat Lengkap</h6>

    <label class="form-label">Provinsi</label>
    <input class="form-control mb-3"
           value="{{ profile.province|default:'-' }}"
           disabled>

    <label class="form-label">Kota/Kabupaten</label>
    <input class="form-control mb-3"
           value="{{ profile.city|default:'-' }}"
           disabled>

    <label class="form-label">Kecamatan</label>
    <input class="form-control mb-3"
           value="{{ profile.district|default:'-' }}"
           disabled>

    <label class="form-label">Kelurahan</label>
    <input class="form-control mb-3"
           value="{{ profile.subdistrict|default:'-' }}"
           disabled>

    <label class="form-label">Alamat Jalan dan Detail Lainnya</label>
    <textarea class="form-control mb-3" disabled>{{ profile.street_address|default:'-' }}</textarea>

    <label class="form-label">Bio</label>
    <textarea class="form-control mb-3"
              disabled>{{ profile.bio|default:'-' }}</textarea>
</div>
{% endblock %}

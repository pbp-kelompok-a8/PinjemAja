{% extends 'base.html' %}
{% load static %}
{% block meta %}
<link rel="stylesheet" href="{% static 'userprofile/css/profile.css' %}">
<script src="{% static 'userprofile/js/toast_stack.js' %}" defer></script>
<script src="https://unpkg.com/htmx.org@1.9.12"  crossorigin="anonymous"></script>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    {% block auth_content %}{% endblock %}
  </div>
</div>

<script>
document.body.addEventListener('showToasts', function (evt) { showToastStack(evt.detail.items); });
</script>
{% endblock %}

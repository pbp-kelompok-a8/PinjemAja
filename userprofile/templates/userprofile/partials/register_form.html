<form id="register-form-container"
      hx-post="{% url 'userprofile:register_htmx' %}"
      hx-target="#register-form-container"
      hx-swap="outerHTML">
    {% csrf_token %}
    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}
            {% if field.help_text %}
                <span class="helptext">{{ field.help_text|safe }}</span>
            {% endif %}
        </p>
    {% endfor %}
    <button type="submit" class="btn btn-pinjemaja-primary w-100">Daftar</button>
</form>

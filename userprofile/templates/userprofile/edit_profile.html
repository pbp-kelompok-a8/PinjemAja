{% extends 'userprofile/profile_base.html' %}
{% block sidebar_content %}
<h4 class="mb-4">Edit Profil</h4>

{% include 'userprofile/partials/edit_profile_form.html' %}

<div class="text-center mt-2">
    <button type="button" class="btn btn-pinjemaja-danger"
            onclick="document.getElementById('hard-delete-dialog').showModal()">
        Hapus Permanen
    </button>
</div>

<dialog id="hard-delete-dialog" style="border:none; border-radius:12px; padding:24px; max-width:380px; width:90%;"
        onclose="this.querySelector('form').reset()">
    <form method="post" action="{% url 'userprofile:hard_delete_account' %}"
          hx-post="{% url 'userprofile:hard_delete_account' %}"
          hx-on::after-request="document.getElementById('hard-delete-dialog').close()">
        {% csrf_token %}
        <h5 class="mb-2 text-danger">Hapus Permanen?</h5>
        <p class="text-muted">Semua data akunmu akan hilang dan tidak bisa dikembalikan. Masukkan password untuk konfirmasi.</p>
        <input type="password" name="password" class="form-control mb-3"
               required autocomplete="current-password">
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-pinjemaja-danger">Hapus</button>
            <button type="button" class="btn btn-pinjemaja-back"
                    onclick="document.getElementById('hard-delete-dialog').close()">Batal</button>
        </div>
    </form>
</dialog>

<script>
    function initWilayah(){
        const WILAYAH_BASE = 'https://www.emsifa.com/api-wilayah-indonesia/v2';

        const provinceSelect = document.getElementById('province-select');
        const citySelect = document.getElementById('city-select');
        const districtSelect = document.getElementById('district-select');
        const subdistrictSelect = document.getElementById('subdistrict-select');

        const provinceHidden = document.getElementById('province-hidden');
        const cityHidden = document.getElementById('city-hidden');
        const districtHidden = document.getElementById('district-hidden');
        const subdistrictHidden = document.getElementById('subdistrict-hidden');

        if (!provinceSelect || !citySelect || !districtSelect || !subdistrictSelect) {
            return;
        }

        const current = {
            province: provinceSelect.dataset.current || '',
            city: citySelect.dataset.current || '',
            district: districtSelect.dataset.current || '',
            subdistrict: subdistrictSelect.dataset.current || ''
        };

        async function fetchRegions(endpoint) {
            const response = await fetch(`${WILAYAH_BASE}/${endpoint}.json`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();
            return result.data;
        }

        function resetSelect(select, placeholder) {
            select.innerHTML = '';

            const option = document.createElement('option');
            option.value = '';
            option.textContent = placeholder;
            select.appendChild(option);
            select.value = '';
            select.disabled = true;
        }

        function fillSelect(select, items, placeholder, selectedName = '') {
            resetSelect(select, placeholder);

            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.name;
                select.appendChild(option);
            });

            // Pilih wilayah berdasarkan NAMA yang tersimpan.
            const matched = items.find(
                item => item.name.toLowerCase() === selectedName.toLowerCase()
            );

            if (matched) {
                select.value = matched.id;
            }

            select.disabled = false;
        }

        function syncHiddenFields() {
            provinceHidden.value =
                provinceSelect.selectedOptions[0]?.textContent || '';

            cityHidden.value =
                citySelect.selectedOptions[0]?.textContent || '';

            districtHidden.value =
                districtSelect.selectedOptions[0]?.textContent || '';

            subdistrictHidden.value =
                subdistrictSelect.selectedOptions[0]?.textContent || '';
        }

        async function loadProvinces() {
            resetSelect(provinceSelect, 'Pilih Provinsi');
            resetSelect(citySelect, 'Pilih Kota/Kabupaten');
            resetSelect(districtSelect, 'Pilih Kecamatan');
            resetSelect(subdistrictSelect, 'Pilih Kelurahan');

            try {
                const provinces = await fetchRegions('provinces');

                fillSelect(
                    provinceSelect,
                    provinces,
                    'Pilih Provinsi',
                    current.province
                );

                if (provinceSelect.value) {
                    await loadCities(current.city, true);
                }

                syncHiddenFields();
            } catch (error) {
                console.error('Gagal memuat provinsi:', error);
            }
        }

        async function loadCities(selectedCity = '', initializing = false) {
            resetSelect(citySelect, 'Pilih Kota/Kabupaten');
            resetSelect(districtSelect, 'Pilih Kecamatan');
            resetSelect(subdistrictSelect, 'Pilih Kelurahan');

            if (!provinceSelect.value) {
                syncHiddenFields();
                return;
            }

            try {
                const cities = await fetchRegions(
                    `regencies/${provinceSelect.value}`
                );

                fillSelect(
                    citySelect,
                    cities,
                    'Pilih Kota/Kabupaten',
                    selectedCity
                );

                if (citySelect.value && initializing) {
                    await loadDistricts(current.district, true);
                }

                syncHiddenFields();
            } catch (error) {
                console.error('Gagal memuat kota/kabupaten:', error);
            }
        }

        async function loadDistricts(selectedDistrict = '', initializing = false) {
            resetSelect(districtSelect, 'Pilih Kecamatan');
            resetSelect(subdistrictSelect, 'Pilih Kelurahan');

            if (!citySelect.value) {
                syncHiddenFields();
                return;
            }

            try {
                const districts = await fetchRegions(
                    `districts/${citySelect.value}`
                );

                fillSelect(
                    districtSelect,
                    districts,
                    'Pilih Kecamatan',
                    selectedDistrict
                );

                if (districtSelect.value && initializing) {
                    await loadSubdistricts(current.subdistrict);
                }

                syncHiddenFields();
            } catch (error) {
                console.error('Gagal memuat kecamatan:', error);
            }
        }

        async function loadSubdistricts(selectedSubdistrict = '') {
            resetSelect(subdistrictSelect, 'Pilih Kelurahan');

            if (!districtSelect.value) {
                syncHiddenFields();
                return;
            }

            try {
                const subdistricts = await fetchRegions(
                    `villages/${districtSelect.value}`
                );

                fillSelect(
                    subdistrictSelect,
                    subdistricts,
                    'Pilih Kelurahan',
                    selectedSubdistrict
                );

                syncHiddenFields();
            } catch (error) {
                console.error('Gagal memuat kelurahan:', error);
            }
        }

        provinceSelect.addEventListener('change', async () => {
            current.city = '';
            current.district = '';
            current.subdistrict = '';
            await loadCities();
            syncHiddenFields();
        });

        citySelect.addEventListener('change', async () => {
            current.district = '';
            current.subdistrict = '';
            await loadDistricts();
            syncHiddenFields();
        });

        districtSelect.addEventListener('change', async () => {
            current.subdistrict = '';
            await loadSubdistricts();
            syncHiddenFields();
        });

        subdistrictSelect.addEventListener('change', syncHiddenFields);

        loadProvinces();
    }

    document.addEventListener('DOMContentLoaded', initWilayah);
    document.body.addEventListener('htmx:afterSwap', initWilayah);

</script>
<script>
document.addEventListener('change', function (event) {
    if (event.target.id !== 'id_avatar') return;
    const file = event.target.files && event.target.files[0];
    if (!file || !file.type.startsWith('image/')) return;

    const box = document.querySelector('.profile-avatar');
    if (!box) return;

    box.innerHTML = '';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.alt = 'Pratinjau foto profil';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
    box.appendChild(img);
});
</script>
<script>
const EWALLETS = ['OVO', 'GoPay', 'DANA', 'ShopeePay'];

function updatePaymentFields() {
    const select = document.getElementById('id_payment_provider');
    const box = document.getElementById('payment-details');
    if (!select || !box) return;

    const value = select.value;
    box.style.display = value ? 'block' : 'none';

    const isEwallet = EWALLETS.includes(value);
    document.getElementById('payment-number-label').textContent =
        (isEwallet ? 'Nomor HP ' : 'Nomor Rekening ') + value;
    document.getElementById('id_payment_number').placeholder =
        isEwallet ? '081234567890' : '1234567890';
}

document.addEventListener('change', (e) => {
    if (e.target.id === 'id_payment_provider') updatePaymentFields();
});
document.addEventListener('DOMContentLoaded', updatePaymentFields);
document.body.addEventListener('htmx:afterSwap', updatePaymentFields);
</script>
{% endblock %}
